name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: |
          cd android
          chmod +x ./gradlew || true

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: looxmaksing-simulator-2-apk
          path: android/app/build/outputs/apk/**/*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v2.0.0
          name: "Looxmaksing Simulator 2 - Official Release v2.0.0"
          body: |
            ## Looxmaksing Simulator 2 (Android APK) 🏎️🏢💎
            
            Официальный релиз игры на Kotlin / Android Jetpack Compose!
            
            ### Возможности игры:
            - **6 Категорий бизнеса**: Бутики, Michelin рестораны, Приватные банки, Небоскребы, IT-корпорации, Космические агентства.
            - **Автомобильный дилерский центр ($40,000)**: Покупка битых авто с аукционов, диагностика узлов (двигатель, коробка, кузов), ремонт и перепродажа с маржой.
            - **Реальные суперкары и гиперкары**: Porsche 911 GT3 RS, Rolls-Royce Phantom, Bugatti Chiron, Ferrari SF90, джеты Gulfstream и яхты.
            - **Футбольный клуб**: Управление составом, тактика и победы.
            - **Инвестиции**: Акции, криптовалюта и элитная недвижимость в Дубае, Нью-Йорке и Монако.
            - **Приватный клуб**: Разблокировка на 4 уровне бизнеса.
          files: android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
