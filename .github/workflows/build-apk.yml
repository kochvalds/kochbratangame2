name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Bundled Assets
        run: |
          ls -la android/app/src/main/assets/
          echo "Assets verified."

      - name: Make Gradlew Executable
        run: |
          cd android
          chmod +x ./gradlew || true

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-output
          APK_FOUND=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -f "$APK_FOUND" ]; then
            echo "Found genuine built APK at $APK_FOUND"
            cp "$APK_FOUND" release-output/LooxmaksingSimulator2.apk
            ls -lh release-output/LooxmaksingSimulator2.apk
          else
            echo "ERROR: APK was not produced by Gradle!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LooxmaksingSimulator2-apk
          path: release-output/LooxmaksingSimulator2.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.0
          name: "Looxmaksing Simulator 2 — Release v2.4.0 (3D GTA Mode, Russian Banya & Looksmaxing)"
          body: |
            ## 💎 Looxmaksing Simulator 2 (Release v2.4.0 — 3D GTA, Русская Баня & Луксмаксинг) 🏎️🧖‍♂️🗿

            Официальный релиз **LooxmaksingSimulator2.apk** на Kotlin / Jetpack Compose с полной интеграцией 3D GTA-мира!

            ### 🔥 Главные нововведения v2.4.0:
            - 🎮 **3D GTA Открытый Мир (Loox City 3D)**:
              - Управление персонажем от 3-го лица (WASD / мобильный сенсорный джойстик, прыжки, спринт, аура).
              - **Реалистичное вождение суперкаров**: садитесь в любой спорткар (Bugatti Chiron, Porsche 911 GT3 RS, Ferrari SF90, Lamborghini Revuelto, Rolls-Royce Phantom), разгон до 350+ км/ч, закись азота NOS, дрифт, спидометр, клаксон и радио.
              - **Интерактивные здания в 3D**: подходите к зданиям и входите в Русскую Баню, Автосалон, Башни Сити, Клинику Луксмаксинга, Стадион или VIP Клуб!
            - 🧖‍♂️ **Интерактивная Русская Баня & SPA-комплекс**:
              - Настоящий кедровый сруб, чугунная каменка, березовые и дубовые веники.
              - **Парение веником**: тонизирует скулы, разгоняет лимфу, очищает кожу (+Кожа & Овал).
              - **Подкинуть на каменку**: выплеснуть эвкалиптовый отвар на раскаленные камни (+Температура и релакс).
              - **Ледяная купель (+4°C)**: закалка сосудов, выброс тестостерона, буст Hunter Eyes!
              - **Самовар с алтайским чаем и мёдом**: восстановление сил.
              - **Пармастер Силыч**: найм легендарного банщика (+20% к доходу бизнеса бессрочно).
            - 🗿 **Полноценная система Луксмаксинга (Looksmaxing Studio)**:
              - Шкала привлекательности (0–100) и ранги: от *Нормиса* до *Chadlite*, *Gigachad* и *Apex Mogger 🗿*.
              - **Интерактивный Мьюинг (Mewing)** со счетчиком стриков и тренировкой челюсти.
              - Процедуры: Mastic Gum, скребок Гуаша из нефрита, Hunter Eyes техники, чистый ретинол, лазер Fraxel, V-Taper тренировки в Gold's Gym, Taper Fade и костюмы Loro Piana.
            - 🏢 **Все 10 Бизнес-Империй & Автодилер ($40k)** из 2D версии сохранены на 100%!
            - 📈 **Биржевые японские свечи, 300 объектов мировой недвижимости, футбольный клуб и налоги**.

            Установочный файл **LooxmaksingSimulator2.apk** прикреплен ниже в блоке Assets!
          files: release-output/LooxmaksingSimulator2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
