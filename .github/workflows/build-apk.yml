name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Bundle & Embed in Android Assets
        run: |
          npm ci || npm install
          npm run build
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/
          mkdir -p android/app/src/main/assets/src/assets/images
          cp -r src/assets/images/* android/app/src/main/assets/src/assets/images/ || true
          echo "Assets bundled successfully:"
          ls -la android/app/src/main/assets/

      - name: Make Gradlew Executable
        run: |
          cd android
          chmod +x ./gradlew || true

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-output
          APK_FOUND=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -f "$APK_FOUND" ]; then
            echo "Found genuine built APK at $APK_FOUND"
            cp "$APK_FOUND" release-output/LooxmaksingSimulator2.apk
            ls -lh release-output/LooxmaksingSimulator2.apk
          else
            echo "ERROR: APK was not produced by Gradle!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LooxmaksingSimulator2-apk
          path: release-output/LooxmaksingSimulator2.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.0
          name: "Looxmaksing Simulator 2 — Release v2.3.0 (Full HTML Preview in APK)"
          body: |
            ## 💎 Looxmaksing Simulator 2 (Release v2.3.0 — Полная версия в APK) 🏎️🏢

            Установочный файл **LooxmaksingSimulator2.apk** содержит 100% функционала из Web-версии игры!

            ### Все возможности внутри APK:
            - 🏢 **10 Бизнес-Империй**: Автодилер ($40k), Розничные бутики, Отели Michelin, Приватный банк, Небоскребы, IT-гигант, Космическое агентство, Нефтегазовая корпорация, Медиахолдинг, Биотех-лаборатория.
            - 🏎️ **50+ Реальных суперкаров**: Porsche 911 GT3 RS, Bugatti Chiron, Koenigsegg Jesko, Ferrari SF90, Rolls-Royce Phantom — диагностика, ремонт узлов и перепродажа.
            - 📈 **Интерактивные биржевые диаграммы (Японские свечи & Линия)** для акций и криптовалют с торговым терминалом.
            - 🏰 **300 Объектов мировой недвижимости** с пассивным доходом.
            - ⚽ **Футбольный клуб** с симуляцией матчей и звездным составом.
            - ⚖️ **Налоговый кабинет** с оптимизацией через юристов, Монако и Швейцарию.
            - 🍸 **Приватный VIP клуб** синдикатов.

            Скачайте **LooxmaksingSimulator2.apk** ниже в списке Assets!
          files: release-output/LooxmaksingSimulator2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
