name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Bundled Assets
        run: |
          ls -la android/app/src/main/assets/
          echo "Assets verified."

      - name: Make Gradlew Executable
        run: |
          cd android
          chmod +x ./gradlew || true

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-output
          APK_FOUND=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -f "$APK_FOUND" ]; then
            echo "Found genuine built APK at $APK_FOUND"
            cp "$APK_FOUND" release-output/LooxmaksingSimulator2.apk
            ls -lh release-output/LooxmaksingSimulator2.apk
          else
            echo "ERROR: APK was not produced by Gradle!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LooxmaksingSimulator2-apk
          path: release-output/LooxmaksingSimulator2.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0
          name: "Looxmaksing Simulator 2 — Release v2.5.0 (Koch Bratan, Gold's Gym, G-Wagon, Armory & Save System)"
          body: |
            ## 💎 Looxmaksing Simulator 2 (Release v2.5.0 — Коч Братан, Спортзал, Гелик, Оружейная & Сохранения) 🏎️🏋️🗿🧖‍♂️
            
            Официальный релиз **LooxmaksingSimulator2.apk** на Kotlin / Jetpack Compose с полным арсеналом открытого 3D мира!
            
            ### 🔥 Главные нововведения версии v2.5.0:
            - 🗿 **Легендарный персонаж Коч Братан**:
              - Встреча в 3D мире рядом с баней и спортзалом.
              - Интерактивные диалоги, наставления по луксмаксингу, кодекс чести Mogger, аудио-реплики и персональные квесты.
            - 🏋️ **Спортзал Gold’s Gym & Коч Зал**:
              - Интерактивные силовые упражнения: Жим штанги лёжа (сотка), Становая тяга, Приседания, Подъем на бицепс, Тяга верхнего блока.
              - Механика тайминг-подхода: зелёная зона, лязг блинов, накачка V-Taper и рост силы!
            - 🚙 **Реалистичный автопарк и физика транспорта**:
              - Mercedes-Benz G63 AMG "Гелик" (V8 Biturbo, брутальный кузов, выхлоп, запаска).
              - Bugatti Chiron Super Sport (400+ км/ч), Porsche 911 GT3 RS, BMW M5 CS, Ferrari SF90 Stradale, Lamborghini Revuelto, Rolls-Royce Phantom.
              - Реалистичная физика: угол заноса, дым из-под колес, форсаж NOS, спидометр, клаксон и радиостанции.
            - 🛍️ **Глубокая кастомизация персонажа & Бутик Роскоши**:
              - Гардероб: Loro Piana кашемир, Chrome Hearts кожа, Brioni смокинг, Gold’s Gym майка.
              - Аксессуары: массивная золотая цепь Miami Cuban Link 14K, часы Patek Philippe Nautilus Rose Gold.
              - Стрижки и борода: Low Taper Fade, Buzzcut Chad, Wall Street Slick Back, щетина 3 мм.
              - Слайдеры мышечной массы (V-Taper) и процента подкожного жира (сухой рельеф).
            - 🔫 **Оружейный Арсенал (Ammu-Nation)**:
              - Золотой Калашников АК-47, Desert Eagle .50 AE, Сайга-12К, снайперская винтовка AWP Arctic.
              - Возможность экипировки и стрельбы со звуковыми эффектами.
            - 🏆 **Система достижений и трофеев**:
              - 10+ достижений уровней Bronze, Silver, Gold, Diamond с денежными наградами и очками престижа.
            - 💾 **Система сохранения прогресса игрока**:
              - Автосохранение каждые 20 секунд, ручное сохранение, экспорт и импорт файлов сохранения в JSON.
            - 🧖‍♂️ **Интерактивная Русская Баня с анимацией парения**:
              - Поддать на каменку, дубовый и березовый веники, ледяная купель (+4°C), самовар с алтайским чаем.
            
            Установочный APK файл **LooxmaksingSimulator2.apk** доступен для загрузки в блоке Assets ниже!
          files: release-output/LooxmaksingSimulator2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

