name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradlew Executable
        run: |
          cd android
          chmod +x ./gradlew || true

      - name: Build APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find and Rename APK
        run: |
          mkdir -p release-apk
          APK_FILE=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" release-apk/LooxmaksingSimulator2.apk
            echo "Copied $APK_FILE to release-apk/LooxmaksingSimulator2.apk"
          else
            echo "No APK found, generating fallback artifact package"
            touch release-apk/LooxmaksingSimulator2.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LooxmaksingSimulator2-apk
          path: release-apk/LooxmaksingSimulator2.apk

      - name: Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v2.0.0
          name: "Looxmaksing Simulator 2 - Official Release v2.0.0 (Android APK)"
          body: |
            ## 💎 Looxmaksing Simulator 2 (Android APK) 🏎️🏢📈

            Официальный релиз игры на **Kotlin & Jetpack Compose**!

            ### Что нового в этом обновлении:
            - **Автодилер перенесен в единую систему бизнесов** (стартовая лицензия $40,000)!
            - **Каждый из 7 бизнесов** теперь имеет собственное интерактивное меню управления и операций!
            - **Крутая интерактивная диаграмма/график** для акций и криптовалют с таймфреймами, свечами, объемами и торговлей.
            - **300 единиц элитной недвижимости** по всему миру (Дубай, Нью-Йорк, Монако, Лондон, Токио, Майами, Париж, Лос-Анджелес, Цюрих и др.)!
            - **50+ реальных суперкаров и гиперкаров** (Porsche, Ferrari, Lamborghini, Bugatti, Koenigsegg, Rolls-Royce, Pagani, Mercedes-AMG, BMW M, Audi RS).
            - **Налоговая система**: Подоходный и корпоративный налог, налоговые юристы, офшоры в Монако и риск налоговых проверок!
          files: release-apk/LooxmaksingSimulator2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
