name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradlew Executable
        run: |
          cd android
          chmod +x ./gradlew || true

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-output
          APK_FOUND=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -f "$APK_FOUND" ]; then
            echo "Found genuine built APK at $APK_FOUND"
            cp "$APK_FOUND" release-output/LooxmaksingSimulator2.apk
            ls -lh release-output/LooxmaksingSimulator2.apk
          else
            echo "ERROR: APK was not produced by Gradle!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LooxmaksingSimulator2-apk
          path: release-output/LooxmaksingSimulator2.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0
          name: "Looxmaksing Simulator 2 — Release v2.2.0 (Official Android APK)"
          body: |
            ## 💎 Looxmaksing Simulator 2 (Android APK Release v2.2.0) 🏎️🏢

            Скомпилированный и подписанный установочный файл Android APK (`LooxmaksingSimulator2.apk`) доступен для скачивания в блоке Assets ниже!

            ### Обновления v2.2.0:
            - **10 Бизнес-Империй**: Автодилер ($40k), Бутики моды, Рестораны Michelin, Приватный банк, Небоскребы, IT-гигант, Космическое агентство, Нефтегазовая корпорация, Медиахолдинг, Биотех-лаборатория.
            - **Свечные диаграммы акций и криптовалют** с торговым терминалом.
            - **300 объектов мировой недвижимости** с пассивной арендой.
            - **50+ реальных суперкаров** (Porsche, Ferrari, Bugatti, Koenigsegg).
            - **Налоговый кабинет** с оптимизацией и офшорами.
          files: release-output/LooxmaksingSimulator2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
